<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Video Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        .upload-area .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-area p {
            color: #666;
            font-size: 14px;
        }
        .upload-area .hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        #fileInput { display: none; }
        .preview-section { margin-top: 24px; }
        .preview-section h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .image-grid .thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #eee;
        }
        .settings {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
        }
        .btn-generate {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-generate:hover { opacity: 0.9; }
        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            display: none;
        }
        .status.loading {
            display: block;
            background: #e8f4fd;
            color: #1a73e8;
        }
        .status.success {
            display: block;
            background: #e6f7e6;
            color: #1b8a1b;
        }
        .status.error {
            display: block;
            background: #fde8e8;
            color: #c62828;
        }
        .result-video {
            margin-top: 20px;
            display: none;
        }
        .result-video.show { display: block; }
        .result-video video {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .result-video .download-link {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 24px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .result-video .download-link:hover { background: #1557b0; }
        .file-count {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: #e8f4fd;
            color: #1a73e8;
            border-radius: 20px;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .settings { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image to Video</h1>
        <p class="subtitle">上传图片，一键生成视频</p>

        <div class="upload-area" id="uploadArea">
            <div class="icon">🖼️</div>
            <p>点击或拖拽图片到这里</p>
            <p class="hint">支持 PNG、JPG、WebP 格式</p>
            <input type="file" id="fileInput" multiple accept="image/*">
        </div>

        <div class="preview-section" id="previewSection" style="display:none">
            <h3>已上传图片 <span class="file-count" id="fileCount">0</span></h3>
            <div class="image-grid" id="imageGrid"></div>
        </div>

        <div class="settings">
            <div class="form-group">
                <label>每张图片时长 (秒)</label>
                <input type="number" id="duration" value="2" min="0.5" max="10" step="0.5">
            </div>
            <div class="form-group">
                <label>帧率 (FPS)</label>
                <input type="number" id="fps" value="24" min="1" max="60">
            </div>
            <div class="form-group">
                <label>输出格式</label>
                <select id="format">
                    <option value="mp4">MP4</option>
                    <option value="avi">AVI</option>
                </select>
            </div>
            <div class="form-group">
                <label>过渡效果</label>
                <select id="transition">
                    <option value="none">无</option>
                    <option value="fade">淡入淡出</option>
                </select>
            </div>
        </div>

        <button class="btn-generate" id="btnGenerate" disabled>生成视频</button>

        <div class="status" id="status"></div>

        <div class="result-video" id="resultVideo">
            <video id="videoPlayer" controls></video>
            <a class="download-link" id="downloadLink" download>下载视频</a>
        </div>
    </div>

    <script>
        let uploadedSessionId = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const imageGrid = document.getElementById('imageGrid');
        const fileCount = document.getElementById('fileCount');
        const btnGenerate = document.getElementById('btnGenerate');
        const status = document.getElementById('status');
        const resultVideo = document.getElementById('resultVideo');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadLink = document.getElementById('downloadLink');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                handleFiles(fileInput.files);
            }
        });

        async function handleFiles(files) {
            const formData = new FormData();
            for (const file of files) {
                formData.append('files', file);
            }

            showStatus('uploading', '正在上传图片...');

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                if (!res.ok) throw new Error('Upload failed');
                const data = await res.json();
                uploadedSessionId = data.session_id;

                showPreview(data.files);
                btnGenerate.disabled = false;
                hideStatus();
            } catch (err) {
                showStatus('error', '上传失败: ' + err.message);
            }
        }

        function showPreview(files) {
            previewSection.style.display = 'block';
            fileCount.textContent = files.length;
            imageGrid.innerHTML = '';
            files.forEach(f => {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = URL.createObjectURL(new Blob());
                img.alt = f;
                img.style.background = '#eee';
                img.style.display = 'flex';
                img.style.alignItems = 'center';
                img.style.justifyContent = 'center';
                img.style.color = '#999';
                img.style.fontSize = '12px';
                img.dataset.filename = f;
                imageGrid.appendChild(img);
            });
        }

        btnGenerate.addEventListener('click', generateVideo);

        async function generateVideo() {
            if (!uploadedSessionId) return;

            const duration = document.getElementById('duration').value;
            const fps = document.getElementById('fps').value;
            const format = document.getElementById('format').value;
            const transition = document.getElementById('transition').value;

            btnGenerate.disabled = true;
            resultVideo.classList.remove('show');
            showStatus('loading', '正在生成视频，请稍候...');

            const formData = new FormData();
            formData.append('session_id', uploadedSessionId);
            formData.append('duration_per_image', duration);
            formData.append('fps', fps);
            formData.append('output_format', format);
            formData.append('transition', transition);

            try {
                const res = await fetch('/api/generate', { method: 'POST', body: formData });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Generation failed');
                }
                const data = await res.json();

                showStatus('success', '视频生成成功！');
                videoPlayer.src = data.video_url;
                downloadLink.href = data.video_url;
                downloadLink.download = data.filename;
                resultVideo.classList.add('show');
            } catch (err) {
                showStatus('error', '生成失败: ' + err.message);
            } finally {
                btnGenerate.disabled = false;
            }
        }

        function showStatus(type, msg) {
            status.className = 'status ' + type;
            status.textContent = msg;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }
    </script>
</body>
</html>
